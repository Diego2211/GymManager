{% extends "miembros/base.html" %}

{% block content %}

<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-md-6">

<div class="card shadow">

<div class="card-header">
<h4>{{msg}}</h4>
</div>

<div class="card-body">

<form method="post" class="mt-4">
    {% csrf_token %}
    {% for i in form %}
        <div class="mb-3">
            {{ i.label_tag }}
            {{ i }}
            {% if i.errors %}
                <div class="text-danger small">
                    {{ i.errors }}
                </div>
            {% endif %}
        </div>
    {% endfor %}

    <button class="btn btn-primary">Guardar</button>
</form>
</div>

</div>

</div>

</div>

</div>


{% endblock %}
