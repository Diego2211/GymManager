<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% load static %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'miembros/css/index.css' %}">
    <!-- Iconos -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <script src="{% static 'miembros/js/index.js' %}"></script>
    <title>Gym Manager</title>
</head>
<body>

<div class="container-fluid">

    <div class="row">

        <!-- SIDEBAR -->
        <div class="col-2 sidebar">

                        <!-- PERFIL -->
                <div class="dropdown mt-3 px-2">
                
                    <a class="nav-link dropdown-toggle d-flex align-items-center gap-2 perfil-btn" 
                       href="#" role="button" data-bs-toggle="dropdown">
                        
                        <img src="{% static 'miembros/img/perfil.png' %}" 
                             width="32" height="32" 
                             class="perfil-img">
                        
                        <span class="perfil-nombre">{{nombre}}</span>
                
                    </a>
                
                    <ul class="dropdown-menu dropdown-menu-dark">
                        <li><a class="dropdown-item" href="{% url 'perfil' %}">
                            <i class="bi bi-person me-2"></i>Mi Perfil
                        </a></li>
                        <li><a class="dropdown-item" href="{% url 'editar perfil' %}">
                            <i class="bi bi-pencil me-2"></i>Editar perfil
                        </a></li>
                        <li><a class="dropdown-item" href="{% url 'elegir gym' %}">
                            <i class="bi bi-pencil me-2"></i>Elegir gimnasio
                        </a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item text-danger" href="{% url 'cerrar sesion' %}">
                            <i class="bi bi-box-arrow-right me-2"></i>Cerrar sesión
                        </a></li>
                    </ul>
                
                </div>


            <ul class="nav flex-column pt-3">

                <!-- Cada li es un item del menú -->
                <li class="nav-item">
                    <a class="nav-link" href="/miembros/"> <i class="bi bi-people-fill"></i> Miembros </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/profesores/"> <i class="bi bi-person-lines-fill"></i></i>Profesores</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/clases/"> <i class="bi bi-person-arms-up"></i>Clases</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/inscribir-alumno/"><i class="bi bi-person-fill-add"></i>Inscribir alumno</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/ingreso-profesor/"><i class="bi bi-person-plus-fill"></i>Inscribir profesor</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/crear-clase/"><i class="bi bi-plus-circle"></i></i>Crear clase</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'crear invitacion' %}"><i class="bi bi-plus-circle"></i></i>crear invitacion</a>
                </li>


            </ul>


        </div>


        <!-- CONTENIDO PRINCIPAL DE LA PÁGINA -->
        <!-- col-10 = ocupa las otras 10 columnas del sistema de grillas -->
        <div class="col-10">

            <!-- container = contenedor centrado de Bootstrap -->
            <!-- mt-4 = margen arriba -->
            <div class="container mt-4">

                {% block content %}
                {% endblock %}

            </div>

        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
