{% extends 'miembros/base.html' %}

{% block content %}

<h2 class="mb-4">Calendario de clases</h2>

<div id="calendar"></div>

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

<style>
#calendar {
  background: white;
  border-radius: 12px;
  padding: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.fc { font-size: 13px; }

.fc-event { border: none !important; background: transparent !important; }
.fc-event-main { padding: 0 !important; }
.fc-timegrid-col-events { margin: 0 2px; }

.fc-scrollgrid {
  border-radius: 10px;
  overflow: hidden;
  border: none !important;
}

.fc-timegrid-slot {
  height: 44px !important;
  border-color: #f5f5f5 !important;
}

.fc-timegrid-slot-label {
  font-size: 11px;
  color: #999;
}

.fc-theme-standard td,
.fc-theme-standard th {
  border-color: #f0f0f0 !important;
}

.fc-col-header-cell {
  background: #7847ff;
  padding: 10px 0;
  border: none !important;
}

.fc-col-header-cell-cushion {
  color: white !important;
  font-size: 14px;
  font-weight: 600;
  text-transform: capitalize;
  text-decoration: none !important;
}

.evento-card {
  background: linear-gradient(135deg, #7847ff, #5a32cc);
  color: white;
  border-radius: 8px;
  padding: 6px 8px;
  height: 100%;
  box-sizing: border-box;
  overflow: hidden;
  cursor: pointer;
  transition: filter 0.15s, transform 0.1s;
  border-left: 3px solid rgba(255,255,255,0.4) !important;
}

.evento-card:hover {
  filter: brightness(1.1);
  transform: scale(1.01);
}

.evento-card b {
  font-size: 12px;
  display: block;
  margin-bottom: 3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.evento-card .meta {
  opacity: 0.85;
  font-size: 10px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.evento-card .badge-alumnos {
  display: inline-block;
  margin-top: 4px;
  background: rgba(255,255,255,0.2);
  border-radius: 4px;
  padding: 1px 6px;
  font-size: 10px;
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function () {
  const calendarEl = document.getElementById('calendar')

  fetch('/api/eventos/')
    .then(r => r.json())
    .then(data => {

      const calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: window.innerWidth < 768 ? 'timeGridDay' : 'timeGridWeek',
        locale: 'es',
        slotMinTime: data.min || "08:00:00",
        slotMaxTime: data.max || "22:00:00",
        height: "auto",
        slotDuration: "00:30:00",
        slotLabelInterval: "01:00:00",
        nowIndicator: false,
        allDaySlot: false,
        expandRows: true,

        // clave para evitar superposición
        slotEventOverlap: false,

        headerToolbar: false,

        buttonText: {
        today: 'Hoy',
        week: 'Semana',
        day: 'Día',
        },

        dayHeaderFormat: { weekday: 'long' },

        buttonIcons: {
        prev: 'chevron-left',
        next: 'chevron-right',
        },

        hiddenDays: data.dias_ocultos,

        events: data.eventos,

        eventContent: function(arg) {
          const p = arg.event.extendedProps
          return {
            html: `
              <div class="evento-card">
                <b>${arg.event.title}</b>
                <div class="meta">
                  <span>🕐 ${p.hora}</span>
                  <span>👤 ${p.profesor}</span>
                </div>
                <span class="badge-alumnos">👥 ${p.alumnos} alumnos</span>
              </div>
            `
          }
        },

        eventClick: function(info) {
          const slug = info.event.extendedProps.slug
          if (slug) window.location.href = `/clases/${slug}/`
        }
      })

      calendar.render()

      window.addEventListener('resize', () => calendar.updateSize())
    })
})
</script>

{% endblock %}
