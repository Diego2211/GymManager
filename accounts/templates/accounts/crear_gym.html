{% extends 'accounts/base.html' %}

{% block content %}

<div class="container mt-5">
    <div class="row">

        <!-- 🔑 Unirse con código -->
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h4 class="mb-3">Unirse con código</h4>

                    <form method="POST">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="form-label">Código de invitación</label>
                            <input type="text" name="codigo" class="form-control" placeholder="Ej: ABC123" required>
                        </div>

                        <button type="submit" name="accion" value="codigo" class="btn btn-primary w-100">
                            Unirse
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- 🏋️ Lista de gimnasios -->
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h4 class="mb-3">Crear gimnasio</h4>

                    <form method="POST">
                        {% csrf_token %}
                        {{ form.as_p }}
                    
                    <div class="text-center mt-4">
                        <button href="{% url 'index' %}" class="btn btn-primary" type="submit">
                            Crear gimnasio
                        </button>
                    </div>
                    </form>
                </div>
            </div>
        </div>

    </div>

    <!-- ➕ Crear gym -->
    <div class="text-center mt-4">
        <a href="{% url 'crear gimnasio' %}" class="btn btn-outline-primary">
            Crear gimnasio
        </a>
    </div>

</div>

{% endblock %}
